<!doctype html><html><head><meta charset="utf-8">
<title>Prisma — Interactive Dataflow (mockup)</title>
<style>
 body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e6e6e6}
 #bar{padding:8px 12px;background:#171a21;border-bottom:1px solid #2a2f3a;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
 #crumbs{display:flex;gap:6px;align-items:center}
 .crumb{cursor:pointer;color:#9fc0ff}.crumb:hover{text-decoration:underline}.crumb.cur{color:#e6e6e6;cursor:default}
 .sep{color:#5a6472}
 button{background:#2a2f3a;color:#e6e6e6;border:1px solid #3a4150;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:13px}
 button:disabled{opacity:.4;cursor:default}
 .hint{color:#8a93a3}
 .sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:3px;vertical-align:middle}
 #out{padding:14px;text-align:center}#out svg{max-width:100%;height:auto;background:#fff;border-radius:6px}
 g.node.act{cursor:pointer}
 g.node.drill>*:nth-child(2){stroke:#3f7fd0;stroke-width:2;stroke-dasharray:5 2.5}
 g.node.act:hover>*:nth-child(2){stroke:#1a1a1a;stroke-width:2}
 #tip{position:fixed;pointer-events:none;background:#0b0d11;border:1px solid #3a4150;border-radius:5px;padding:3px 8px;font-size:12px;color:#dfe6f2;display:none;z-index:20}
 #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2330;border:1px solid #3f7fd0;border-radius:8px;padding:9px 15px;font-size:13px;display:none;z-index:20}
</style></head><body>
<div id="bar">
 <button id="zoomout">⤢ Zoom out</button>
 <div id="crumbs"></div>
 <span class="hint">click a <b style="color:#9fc0ff">dashed</b> node to expand · <b>Zoom out</b> jumps up to the systems view · click a step to open its wiki page</span>
 <span style="flex:1"></span>
 <span><span class="sw" style="background:#cfe3ff"></span>input</span><span><span class="sw" style="background:#bdeccb"></span>step</span><span><span class="sw" style="background:#e3d7f5"></span>model</span><span><span class="sw" style="background:#e7ecf2"></span>data</span><span><span class="sw" style="background:#ffdfa6"></span>output</span>
</div>
<div id="out">rendering…</div>
<div id="tip"></div><div id="toast"></div>

<script>
const DOTS={"Overview": "digraph G {\nrankdir=LR; splines=ortho; bgcolor=\"white\"; pad=0.4; nodesep=0.4; ranksep=0.9;\nnode [shape=box,style=\"filled,rounded\",fontname=\"Helvetica\",fontsize=11,penwidth=0.6,color=\"#33333333\"];\nedge [color=\"#7d8794\",arrowsize=0.75,penwidth=1.1];\n  \"image\" [fillcolor=\"#cfe3ff\", label=<<b>Source image</b>>];\n  \"palette\" [fillcolor=\"#cfe3ff\", label=<<b>Palette + printer</b><br/><font point-size=\"8\">filaments \u00b7 nozzle</font>>];\n  \"calib\" [fillcolor=\"#cfe3ff\", label=<<b>Calibration</b><br/><font point-size=\"8\">profiles \u00b7 bundle<br/>camera transform</font>>];\n  \"preprocess\" [fillcolor=\"#bdeccb\", label=<<b>Preprocess</b><br/><font point-size=\"8\">F1 \u00b7 optional (default off)</font>>];\n  \"target\" [fillcolor=\"#bdeccb\", label=<<b>Target cloud</b><br/><font point-size=\"8\">ingress \u2192 OKLab colours</font>>];\n  \"model\" [fillcolor=\"#e3d7f5\", label=<<b>Colour model</b><br/><font point-size=\"8\">spline / photo-stack<br/>predicts stack colour</font>>];\n  \"lut\" [fillcolor=\"#bdeccb\", label=<<b>Build joint LUT</b><br/><font point-size=\"8\">queried by solve<br/>hull feeds gamut</font>>];\n  \"gamut\" [fillcolor=\"#bdeccb\", label=<<b>Gamut map</b><br/><font point-size=\"8\">out-of-reach \u2192 achievable</font>>];\n  \"solve\" [fillcolor=\"#bdeccb\", label=<<b>Staged solve</b><br/><font point-size=\"8\">Stage 0\u20135 \u00b7 the core</font>>];\n  \"maps\" [fillcolor=\"#e7ecf2\", label=<<b>Thickness maps</b><br/><font point-size=\"8\">+ cap plan</font>>];\n  \"group\" [fillcolor=\"#bdeccb\", label=<<b>AMS grouping</b><br/><font point-size=\"8\">optional \u00b7 slots</font>>];\n  \"export\" [fillcolor=\"#bdeccb\", label=<<b>Export \u2192 mesh</b>>];\n  \"stl\" [fillcolor=\"#ffdfa6\", label=<<b>STL / 3MF</b><br/><font point-size=\"8\">+ manifest</font>>];\n  \"preview\" [fillcolor=\"#ffdfa6\", label=<<b>Predicted preview</b>>];\n  \"stats\" [fillcolor=\"#ffdfa6\", label=<<b>Quality stats</b><br/><font point-size=\"8\">\u0394E \u00b7 coverage</font>>];\n  \"image\" -> \"preprocess\";\n  \"preprocess\" -> \"target\";\n  \"target\" -> \"gamut\";\n  \"gamut\" -> \"solve\";\n  \"calib\" -> \"model\";\n  \"model\" -> \"lut\";\n  \"model\" -> \"solve\";\n  \"model\" -> \"preview\";\n  \"lut\" -> \"gamut\";\n  \"lut\" -> \"solve\";\n  \"palette\" -> \"lut\";\n  \"palette\" -> \"solve\";\n  \"palette\" -> \"group\";\n  \"solve\" -> \"maps\";\n  \"maps\" -> \"group\";\n  \"group\" -> \"export\";\n  \"export\" -> \"stl\";\n  \"maps\" -> \"preview\";\n  \"solve\" -> \"stats\";\n}", "Preprocess \u2014 detail": "digraph G {\nrankdir=LR; splines=ortho; bgcolor=\"white\"; pad=0.4; nodesep=0.4; ranksep=0.9;\nnode [shape=box,style=\"filled,rounded\",fontname=\"Helvetica\",fontsize=11,penwidth=0.6,color=\"#33333333\"];\nedge [color=\"#7d8794\",arrowsize=0.75,penwidth=1.1];\nsubgraph cluster_main { label=\"F1 preprocessing runner \u2014 run_preprocessing_pipeline\"; fontname=\"Helvetica-Bold\"; fontsize=12; labelloc=\"t\"; style=\"rounded\"; color=\"#a9b0bb\"; bgcolor=\"#fafbfc\";\n    \"pp_sort\" [fillcolor=\"#bdeccb\", label=<<b>Sort operators</b><br/><font point-size=\"8\">by order band (Wings A\u2013D)<br/>stable \u00b7 class-name tiebreak</font>>];\n    \"pp_valid\" [fillcolor=\"#bdeccb\", label=<<b>Validate chain</b><br/><font point-size=\"8\">tail must emit sRGB<br/>else contract error, zero work</font>>];\n    \"pp_run\" [fillcolor=\"#bdeccb\", label=<<b>Run the chain</b><br/><font point-size=\"8\">convert at each domain boundary<br/>apply \u00b7 validate per operator</font>>];\n    \"pp_preview\" [fillcolor=\"#ffdfa6\", label=<<b>Per-operator preview</b><br/><font point-size=\"8\">snapshot frame \u00b7 view-only<br/>downstream raster unchanged</font>>];\n}\n  \"pp_img\" [fillcolor=\"#eef1f4\", label=<<b>Loaded image</b><br/><font point-size=\"8\">sRGB \u00b7 post profile-load</font>>, shape=box3d];\n  \"pp_ctx\" [fillcolor=\"#eef1f4\", label=<<b>F2/F3 context</b><br/><font point-size=\"8\">palette metadata \u00b7 protect mask<br/>each opt-in per operator</font>>, shape=box3d];\n  \"pp_out\" [fillcolor=\"#eef1f4\", label=<<b>\u2192 Target cloud</b><br/><font point-size=\"8\">post-preprocess sRGB<br/>+ trace \u00b7 debug maps</font>>, shape=box3d];\n  \"pp_img\" -> \"pp_sort\";\n  \"pp_sort\" -> \"pp_valid\";\n  \"pp_valid\" -> \"pp_run\";\n  \"pp_ctx\" -> \"pp_run\";\n  \"pp_run\" -> \"pp_preview\";\n  \"pp_run\" -> \"pp_out\";\n}", "Target cloud \u2014 detail": "digraph G {\nrankdir=LR; splines=ortho; bgcolor=\"white\"; pad=0.4; nodesep=0.4; ranksep=0.9;\nnode [shape=box,style=\"filled,rounded\",fontname=\"Helvetica\",fontsize=11,penwidth=0.6,color=\"#33333333\"];\nedge [color=\"#7d8794\",arrowsize=0.75,penwidth=1.1];\nsubgraph cluster_main { label=\"Solve target cloud \u2014 compute_solve_target_cloud\"; fontname=\"Helvetica-Bold\"; fontsize=12; labelloc=\"t\"; style=\"rounded\"; color=\"#a9b0bb\"; bgcolor=\"#fafbfc\";\n    \"tc_ingress\" [fillcolor=\"#bdeccb\", label=<<b>Ingress</b><br/><font point-size=\"8\">sRGB \u2192 model domain<br/>Camera Transform LUT (default on)</font>>];\n    \"tc_oklab\" [fillcolor=\"#bdeccb\", label=<<b>OKLab convert</b><br/><font point-size=\"8\">linear_to_oklab \u00b7 per pixel</font>>];\n    \"tc_proj\" [fillcolor=\"#bdeccb\", label=<<b>Grid projection</b><br/><font point-size=\"8\">observation \u2192 solve grid<br/>identity when pitches match</font>>];\n    \"tc_rescale\" [fillcolor=\"#bdeccb\", label=<<b>White-point rescale</b><br/><font point-size=\"8\">von Kries to paper white<br/>optional \u00b7 default off</font>>];\n    \"tc_cloud\" [fillcolor=\"#e7ecf2\", label=<<b>SolveTargetCloud</b><br/><font point-size=\"8\">observed + solve OKLab<br/>domain = model_oklab</font>>];\n}\n  \"tc_img\" [fillcolor=\"#eef1f4\", label=<<b>Source image</b><br/><font point-size=\"8\">post-preprocess sRGB</font>>, shape=box3d];\n  \"tc_calib\" [fillcolor=\"#eef1f4\", label=<<b>Camera Transform</b><br/><font point-size=\"8\">inverse ingress LUT</font>>, shape=box3d];\n  \"tc_out\" [fillcolor=\"#eef1f4\", label=<<b>\u2192 Gamut map \u00b7 solve</b><br/><font point-size=\"8\">solve_oklab targets<br/>same path \u2192 palette suggest</font>>, shape=box3d];\n  \"tc_img\" -> \"tc_ingress\";\n  \"tc_calib\" -> \"tc_ingress\";\n  \"tc_ingress\" -> \"tc_oklab\";\n  \"tc_oklab\" -> \"tc_proj\";\n  \"tc_proj\" -> \"tc_cloud\";\n  \"tc_cloud\" -> \"tc_rescale\";\n  \"tc_rescale\" -> \"tc_out\";\n}", "Build joint LUT \u2014 detail": "digraph G {\nrankdir=LR; splines=ortho; bgcolor=\"white\"; pad=0.4; nodesep=0.4; ranksep=0.9;\nnode [shape=box,style=\"filled,rounded\",fontname=\"Helvetica\",fontsize=11,penwidth=0.6,color=\"#33333333\"];\nedge [color=\"#7d8794\",arrowsize=0.75,penwidth=1.1];\nsubgraph cluster_main { label=\"Build joint LUT \u2014 lut.py / photo_stack_lut.py\"; fontname=\"Helvetica-Bold\"; fontsize=12; labelloc=\"t\"; style=\"rounded\"; color=\"#a9b0bb\"; bgcolor=\"#fafbfc\";\n    \"lu_path\" [fillcolor=\"#bdeccb\", label=<<b>Pick build path</b><br/><font point-size=\"8\">spline build_luts<br/>else provider (photo-stack)</font>>];\n    \"lu_enum\" [fillcolor=\"#bdeccb\", label=<<b>Enumerate stacks</b><br/><font point-size=\"8\">combos per subset \u00b7 cap step<br/>stars-and-bars under budget</font>>];\n    \"lu_compose\" [fillcolor=\"#bdeccb\", label=<<b>Compose \u2192 OKLab</b><br/><font point-size=\"8\">transmission per layer \u00b7 clip<br/>to_oklab</font>>];\n    \"lu_prune\" [fillcolor=\"#bdeccb\", label=<<b>Prune near-dupes</b><br/><font point-size=\"8\">bin OKLab 0.005 \u00b7 keep thinnest</font>>];\n    \"lu_tree\" [fillcolor=\"#e7ecf2\", label=<<b>Chroma-weighted KD-tree</b><br/><font point-size=\"8\">LUTEntry per subset<br/>L* \u00f7 chroma_weight in tree</font>>];\n    \"lu_hull\" [fillcolor=\"#e7ecf2\", label=<<b>Convex hull</b><br/><font point-size=\"8\">achievable-gamut surface</font>>];\n    \"lu_cache\" [fillcolor=\"#e7ecf2\", label=<<b>Disk cache (npz)</b><br/><font point-size=\"8\">trees rebuilt on load</font>>];\n}\n  \"lu_palette\" [fillcolor=\"#eef1f4\", label=<<b>Palette + printer</b><br/><font point-size=\"8\">filaments \u00b7 k_max \u00b7 budget</font>>, shape=box3d];\n  \"lu_model\" [fillcolor=\"#eef1f4\", label=<<b>Colour model</b><br/><font point-size=\"8\">model_kind picks the path</font>>, shape=box3d];\n  \"lu_query\" [fillcolor=\"#eef1f4\", label=<<b>\u2192 Staged solve</b><br/><font point-size=\"8\">query_luts_batch \u00b7 nearest stack</font>>, shape=box3d];\n  \"lu_gamut\" [fillcolor=\"#eef1f4\", label=<<b>\u2192 Gamut map</b><br/><font point-size=\"8\">hull facets</font>>, shape=box3d];\n  \"lu_palette\" -> \"lu_path\";\n  \"lu_model\" -> \"lu_path\";\n  \"lu_path\" -> \"lu_enum\";\n  \"lu_enum\" -> \"lu_compose\";\n  \"lu_compose\" -> \"lu_prune\";\n  \"lu_prune\" -> \"lu_tree\";\n  \"lu_tree\" -> \"lu_hull\";\n  \"lu_tree\" -> \"lu_cache\";\n  \"lu_tree\" -> \"lu_query\";\n  \"lu_hull\" -> \"lu_gamut\";\n}", "Gamut map \u2014 detail": "digraph G {\nrankdir=LR; splines=ortho; bgcolor=\"white\"; pad=0.4; nodesep=0.4; ranksep=0.9;\nnode [shape=box,style=\"filled,rounded\",fontname=\"Helvetica\",fontsize=11,penwidth=0.6,color=\"#33333333\"];\nedge [color=\"#7d8794\",arrowsize=0.75,penwidth=1.1];\nsubgraph cluster_main { label=\"Gamut mapping \u2014 _apply_target_gamut_mapping\"; fontname=\"Helvetica-Bold\"; fontsize=12; labelloc=\"t\"; style=\"rounded\"; color=\"#a9b0bb\"; bgcolor=\"#fafbfc\";\n    \"gm_rescale\" [fillcolor=\"#bdeccb\", label=<<b>White-point rescale</b><br/><font point-size=\"8\">von Kries to paper white<br/>optional \u00b7 default off</font>>];\n    \"gm_mode\" [fillcolor=\"#bdeccb\", label=<<b>Select mode</b><br/><font point-size=\"8\">hull (default) \u00b7 chroma \u00b7 none</font>>];\n    \"gm_hullproj\" [fillcolor=\"#bdeccb\", label=<<b>Hull projection</b><br/><font point-size=\"8\">nearest facet \u00b7 \u22644 passes<br/>low dE \u00b7 L* may shift</font>>];\n    \"gm_chroma\" [fillcolor=\"#bdeccb\", label=<<b>Chroma compression</b><br/><font point-size=\"8\">12-step search on a,b<br/>L* + hue exact</font>>];\n    \"gm_diag\" [fillcolor=\"#e7ecf2\", label=<<b>Diagnostics</b><br/><font point-size=\"8\">remap mask \u00b7 OKLab shift<br/>__target_gamut_mask__ raster</font>>];\n}\n  \"gm_targets\" [fillcolor=\"#eef1f4\", label=<<b>Solve targets</b><br/><font point-size=\"8\">OKLab \u00b7 on solve grid</font>>, shape=box3d];\n  \"gm_hull\" [fillcolor=\"#eef1f4\", label=<<b>Achievable hull</b><br/><font point-size=\"8\">from the joint LUT</font>>, shape=box3d];\n  \"gm_out\" [fillcolor=\"#eef1f4\", label=<<b>\u2192 Staged solve</b><br/><font point-size=\"8\">remapped targets (in place)</font>>, shape=box3d];\n  \"gm_targets\" -> \"gm_rescale\";\n  \"gm_rescale\" -> \"gm_mode\";\n  \"gm_hull\" -> \"gm_hullproj\";\n  \"gm_mode\" -> \"gm_hullproj\";\n  \"gm_mode\" -> \"gm_chroma\";\n  \"gm_hullproj\" -> \"gm_diag\";\n  \"gm_chroma\" -> \"gm_diag\";\n  \"gm_hullproj\" -> \"gm_out\";\n  \"gm_chroma\" -> \"gm_out\";\n  \"gm_mode\" -> \"gm_out\";\n}", "Staged solve \u2014 detail": "digraph G {\nrankdir=LR; splines=ortho; bgcolor=\"white\"; pad=0.4; nodesep=0.4; ranksep=0.9;\nnode [shape=box,style=\"filled,rounded\",fontname=\"Helvetica\",fontsize=11,penwidth=0.6,color=\"#33333333\"];\nedge [color=\"#7d8794\",arrowsize=0.75,penwidth=1.1];\nsubgraph cluster_main { label=\"Staged solve \u2014 Stage 0\u20135 (inner workings)\"; fontname=\"Helvetica-Bold\"; fontsize=12; labelloc=\"t\"; style=\"rounded\"; color=\"#a9b0bb\"; bgcolor=\"#fafbfc\";\n    \"s0\" [fillcolor=\"#bdeccb\", label=<<b>Stage 0 \u00b7 directives</b><br/><font point-size=\"8\">compile + quantize<br/>the solve plan</font>>];\n    \"s1\" [fillcolor=\"#bdeccb\", label=<<b>Stage 1 \u00b7 lateral zones</b><br/><font point-size=\"8\">segment into coarse<br/>same-recipe regions</font>>];\n    \"s2\" [fillcolor=\"#bdeccb\", label=<<b>Stage 2 \u00b7 recipe assignment</b><br/><font point-siz // In an iframe, navigate the parent page (the whole site), not the framed graph.
const EMBED=!!(window.top&&window.top!==window.self);
const NAV=EMBED?window.top:window;
// Where the docs live, for click-through. Priority: ?base= override, then a global,

let DOCS_BASE=new URLSearchParams(location.search).get('base')||(window.PRISMA_DOCS_BASE||'');
if(!DOCS_BASE&&EMBED){const m=location.pathname.match(/^(.*\/)static\/[^/]+$/);if(m)DOCS_BASE=m[1];}
let viz=null, current='Overview';
const tip=document.getElementById('tip'), toast=document.getElementById('toast'), zoomout=document.getElementById('zoomout');
Viz.instance().then(v=>{viz=v;render()}).catch(e=>{document.getElementById('out').textContent='viz.js failed: '+e});
zoomout.onclick=()=>{if(PARENT[current]){current=PARENT[current];render()}};
function chain(v){const c=[v];while(PARENT[c[0]])c.unshift(PARENT[c[0]]);return c;}
function crumbs(){const el=document.getElementById('crumbs');el.innerHTML='';chain(current).forEach((v,i)=>{if(i)el.insertAdjacentHTML('beforeend','<span class="sep">›</span>');const s=document.createElement('span');s.className='crumb'+(v===current?' cur':'');s.textContent=TITLES[v]||v;if(v!==current)s.onclick=()=>{current=v;render()};el.appendChild(s)})}
function showToast(t,u){toast.textContent='↗ would open wiki page:   '+t+(u?'   /'+u:'');toast.style.display='block';clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.style.display='none',2600)}
function render(){zoomout.disabled=!PARENT[current];crumbs();const o=document.getElementById('out');if(!viz)return;o.innerHTML='';const svg=viz.renderSVGElement(DOTS[current]);o.appendChild(svg);
 const acts=ACTIONS[current]||{};
 svg.querySelectorAll('g.node').forEach(g=>{const t=g.querySelector('title');if(!t)return;const a=acts[t.textContent];if(!a)return;g.classList.add('act');if(a.drill)g.classList.add('drill');
  g.addEventListener('mousemove',e=>{tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';tip.textContent=a.drill?('⤢ expand: '+(TITLES[a.drill]||a.drill)):('↗ open wiki: '+a.wiki)});
  g.addEventListener('mouseleave',()=>tip.style.display='none');
  g.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();tip.style.display='none';if(a.drill){current=a.drill;render()}else if(DOCS_BASE){NAV.location.href=DOCS_BASE+a.url}else{showToast(a.wiki,a.url)}});
