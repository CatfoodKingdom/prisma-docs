<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
  <title id="title">One fixed capture session and the sample open-side direction</title>
  <desc id="desc">A fixed camera photographs the same unmoved lightbox first as a blank image and then with a sample. A second detail shows that the selected open-side arrow must point toward the unframed edge of the sample geometry in the sample image.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="arrow-fill"/></marker>
    <style>
      :root { --surface:#f8fafc; --surface-2:#e8edf3; --text:#1f2937; --muted:#52606d; --line:#6b7a8a; --grid:#c8d0d9; --light:#f4f1df; --cyan:#35a9c8; --magenta:#d65b88; --yellow:#e8bc3d; }
      @media (prefers-color-scheme:dark) { :root { --surface:#151a22; --surface-2:#252d38; --text:#edf2f7; --muted:#b3bfcc; --line:#9aa8b7; --grid:#3c4653; --light:#d8d5c5; --cyan:#43b8d7; --magenta:#e16c99; --yellow:#f0ca51; } }
      text { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; fill:var(--text); letter-spacing:0; }
      .heading { font-size:19px; font-weight:600; } .label { font-size:15px; font-weight:600; } .note { font-size:14px; fill:var(--muted); } .tiny { font-size:13px; fill:var(--muted); }
      .panel { fill:var(--surface-2); stroke:var(--grid); stroke-width:1.5; } .frame { fill:#111; stroke:var(--line); stroke-width:2; }
      .camera { fill:var(--surface-2); stroke:var(--line); stroke-width:2; } .guide { fill:none; stroke:var(--magenta); stroke-width:2.5; marker-end:url(#arrow); }
      .arrow-fill { fill:var(--magenta); }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="8" fill="var(--surface)" stroke="var(--grid)"/>
  <text x="305" y="35" text-anchor="middle" class="heading">One unchanged capture session</text>
  <text x="305" y="58" text-anchor="middle" class="note">same camera position, exposure, focus, orientation, and lightbox</text>

  <g transform="translate(42 82)">
    <rect x="0" y="0" width="526" height="225" rx="5" class="panel"/>
    <g transform="translate(230 12)">
      <path d="M20 0 H66 L78 15 H101 V58 H0 V15 H15 Z" class="camera"/>
      <circle cx="51" cy="31" r="18" fill="var(--surface)" stroke="var(--line)" stroke-width="3"/>
      <circle cx="51" cy="31" r="8" fill="var(--cyan)"/>
      <path d="M51 58 V79" stroke="var(--line)" stroke-width="3"/>
    </g>
    <path d="M281 91 L142 119 M281 91 L384 119" stroke="var(--grid)" stroke-width="1.5" stroke-dasharray="6 5"/>
    <g transform="translate(28 119)">
      <rect width="218" height="80" rx="4" class="frame"/>
      <rect x="28" y="14" width="162" height="52" rx="2" fill="var(--light)"/>
      <text x="109" y="101" text-anchor="middle" class="label">Blank image</text>
    </g>
    <g transform="translate(280 119)">
      <rect width="218" height="80" rx="4" class="frame"/>
      <rect x="28" y="14" width="162" height="52" rx="2" fill="var(--light)"/>
      <g transform="translate(60 31)">
        <rect x="0" y="0" width="19" height="20" fill="var(--cyan)" fill-opacity=".45"/>
        <rect x="19" y="0" width="19" height="20" fill="var(--cyan)" fill-opacity=".57"/>
        <rect x="38" y="0" width="19" height="20" fill="var(--cyan)" fill-opacity=".69"/>
        <rect x="57" y="0" width="19" height="20" fill="var(--cyan)" fill-opacity=".81"/>
        <rect x="76" y="0" width="19" height="20" fill="var(--cyan)"/>
        <path d="M0 0 H105 V5 H5 V20 H0 Z" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1"/>
      </g>
      <text x="109" y="101" text-anchor="middle" class="label">Sample image</text>
    </g>
  </g>
  <text x="305" y="333" text-anchor="middle" class="note">If the camera or lightbox moves, capture a new blank image.</text>

  <line x1="604" y1="74" x2="604" y2="373" stroke="var(--grid)" stroke-width="2"/>
  <text x="781" y="35" text-anchor="middle" class="heading">Open-side direction</text>
  <text x="781" y="58" text-anchor="middle" class="note">match the arrow to the sample image</text>
  <g transform="translate(646 105)">
    <rect width="270" height="184" rx="5" class="panel"/>
    <rect x="22" y="20" width="226" height="132" rx="3" class="frame"/>
    <rect x="42" y="37" width="186" height="98" rx="2" fill="var(--light)"/>
    <g transform="translate(75 62)">
      <rect x="6" y="6" width="26" height="48" fill="var(--cyan)" fill-opacity=".45"/>
      <rect x="32" y="6" width="26" height="48" fill="var(--cyan)" fill-opacity=".58"/>
      <rect x="58" y="6" width="26" height="48" fill="var(--cyan)" fill-opacity=".72"/>
      <rect x="84" y="6" width="26" height="48" fill="var(--cyan)" fill-opacity=".86"/>
      <path d="M0 0 H116 V60 H110 V6 H6 V60 H0 Z" fill="var(--surface-2)" stroke="var(--line)" stroke-width="2"/>
      <path d="M58 63 V82" class="guide"/>
      <text x="58" y="98" text-anchor="middle" class="tiny">open side</text>
    </g>
  </g>
  <g transform="translate(712 315)">
    <rect width="138" height="54" rx="5" fill="var(--surface-2)" stroke="var(--grid)"/>
    <text x="69" y="21" text-anchor="middle" class="note">selected direction</text>
    <path d="M69 28 V45" class="guide"/>
  </g>
  <text x="781" y="405" text-anchor="middle" class="note">The arrow points toward the edge without the spine.</text>
</svg>
