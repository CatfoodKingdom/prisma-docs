<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
  <title id="title">CMY and image-tailored palette coverage</title>
  <desc id="desc">The CMY palette produces vivid stack colors spread broadly through color space, but few fall inside the muted region used by the source image. A palette of forest green, yellow green, and blue gray produces many closely spaced stack colors inside that source-image region.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" class="arrow-fill"/>
    </marker>
    <style>
      :root {
        --surface: #f8fafc;
        --surface-2: #e8edf3;
        --text: #1f2937;
        --muted: #52606d;
        --line: #6b7a8a;
        --grid: #c8d0d9;
        --target-fill: #dce5df;
        --target-line: #697b70;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #151a22;
          --surface-2: #252d38;
          --text: #edf2f7;
          --muted: #b3bfcc;
          --line: #9aa8b7;
          --grid: #3c4653;
          --target-fill: #2d3a34;
          --target-line: #a5b5aa;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text); letter-spacing: 0; }
      .heading { font-size: 19px; font-weight: 600; }
      .note { font-size: 15px; fill: var(--muted); }
      .chip-label { font-size: 13px; font-weight: 600; }
      .chip-light { fill: #ffffff; }
      .chip-dark { fill: #1f2937; }
      .field-label { font-size: 14px; fill: var(--muted); }
      .field { fill: var(--surface-2); fill-opacity: 0.52; stroke: var(--grid); stroke-width: 1.5; }
      .target { fill: var(--target-fill); fill-opacity: 0.72; stroke: var(--target-line); stroke-width: 2; stroke-dasharray: 7 5; }
      .connector { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
      .arrow-fill { fill: var(--line); }
      .mix { stroke: var(--surface); stroke-width: 2.5; }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="498" rx="8" fill="var(--surface)" stroke="var(--grid)"/>
  <line x1="480" y1="28" x2="480" y2="472" stroke="var(--grid)" stroke-width="1.5"/>

  <!-- CMY palette. -->
  <g>
    <text x="240" y="43" text-anchor="middle" class="heading">CMY palette</text>
    <text x="240" y="67" text-anchor="middle" class="note">wide spread of vivid reachable colors</text>

    <g transform="translate(128 88)">
      <rect x="0" y="0" width="68" height="44" rx="4" fill="#0086d6" stroke="var(--line)"/>
      <text x="34" y="27" text-anchor="middle" class="chip-label chip-light">Cyan</text>
      <rect x="76" y="0" width="68" height="44" rx="4" fill="#ec008c" stroke="var(--line)"/>
      <text x="110" y="27" text-anchor="middle" class="chip-label chip-light">Magenta</text>
      <rect x="152" y="0" width="68" height="44" rx="4" fill="#f4ee2a" stroke="var(--line)"/>
      <text x="186" y="27" text-anchor="middle" class="chip-label chip-dark">Yellow</text>
    </g>
    <path d="M240 139 V169" class="connector"/>
    <text x="252" y="159" class="field-label">stack combinations</text>

    <path class="field" d="M65 330 C65 236 137 186 240 186 C343 186 415 236 415 330 C415 419 346 458 240 458 C134 458 65 419 65 330 Z"/>
    <text x="82" y="211" class="field-label">reachable stack colors</text>

    <path class="target" d="M173 303 C195 272 251 258 292 279 C326 297 330 342 304 372 C278 401 218 403 184 379 C155 358 151 332 173 303 Z"/>
    <path d="M132 273 C150 277 165 287 177 302" class="connector"/>
    <text x="82" y="253" class="field-label">colors used by</text>
    <text x="82" y="270" class="field-label">the source image</text>

    <circle class="mix" cx="88" cy="319" r="9" fill="#00aeca"/>
    <circle class="mix" cx="100" cy="285" r="9" fill="#0086d6"/>
    <circle class="mix" cx="175" cy="229" r="9" fill="#245bd2"/>
    <circle class="mix" cx="240" cy="216" r="9" fill="#7c3ec7"/>
    <circle class="mix" cx="309" cy="232" r="9" fill="#c625a3"/>
    <circle class="mix" cx="366" cy="258" r="9" fill="#ec008c"/>
    <circle class="mix" cx="395" cy="321" r="9" fill="#ee5548"/>
    <circle class="mix" cx="374" cy="388" r="9" fill="#f09230"/>
    <circle class="mix" cx="319" cy="431" r="9" fill="#f4ee2a"/>
    <circle class="mix" cx="245" cy="446" r="9" fill="#83cf1f"/>
    <circle class="mix" cx="168" cy="430" r="9" fill="#00b66f"/>
    <circle class="mix" cx="108" cy="389" r="9" fill="#00ad9b"/>
    <circle class="mix" cx="199" cy="340" r="8" fill="#5aa773"/>
    <circle class="mix" cx="293" cy="303" r="8" fill="#a6ae54"/>
  </g>

  <!-- Image-tailored palette. -->
  <g>
    <text x="720" y="43" text-anchor="middle" class="heading">Image-tailored palette</text>
    <text x="720" y="67" text-anchor="middle" class="note">dense coverage around the source-image colors</text>

    <g transform="translate(608 88)">
      <rect x="0" y="0" width="68" height="44" rx="4" fill="#317553" stroke="var(--line)"/>
      <text x="34" y="20" text-anchor="middle" class="chip-label chip-light">Forest</text>
      <text x="34" y="34" text-anchor="middle" class="chip-label chip-light">green</text>
      <rect x="76" y="0" width="68" height="44" rx="4" fill="#becf00" stroke="var(--line)"/>
      <text x="110" y="20" text-anchor="middle" class="chip-label chip-dark">Yellow</text>
      <text x="110" y="34" text-anchor="middle" class="chip-label chip-dark">green</text>
      <rect x="152" y="0" width="68" height="44" rx="4" fill="#657a89" stroke="var(--line)"/>
      <text x="186" y="20" text-anchor="middle" class="chip-label chip-light">Blue</text>
      <text x="186" y="34" text-anchor="middle" class="chip-label chip-light">gray</text>
    </g>
    <path d="M720 139 V169" class="connector"/>
    <text x="732" y="159" class="field-label">stack combinations</text>

    <path class="field" d="M545 330 C545 236 617 186 720 186 C823 186 895 236 895 330 C895 419 826 458 720 458 C614 458 545 419 545 330 Z"/>
    <text x="562" y="211" class="field-label">reachable stack colors</text>

    <path class="target" d="M653 303 C675 272 731 258 772 279 C806 297 810 342 784 372 C758 401 698 403 664 379 C635 358 631 332 653 303 Z"/>
    <path d="M612 273 C630 277 645 287 657 302" class="connector"/>
    <text x="562" y="253" class="field-label">colors used by</text>
    <text x="562" y="270" class="field-label">the source image</text>

    <circle class="mix" cx="644" cy="326" r="8" fill="#2f5d49"/>
    <circle class="mix" cx="663" cy="300" r="8" fill="#426b4d"/>
    <circle class="mix" cx="689" cy="286" r="8" fill="#587a51"/>
    <circle class="mix" cx="720" cy="283" r="8" fill="#718a57"/>
    <circle class="mix" cx="749" cy="291" r="8" fill="#8e9d62"/>
    <circle class="mix" cx="777" cy="307" r="8" fill="#a9ae75"/>
    <circle class="mix" cx="796" cy="332" r="8" fill="#b8bd8f"/>
    <circle class="mix" cx="787" cy="360" r="8" fill="#a8b39b"/>
    <circle class="mix" cx="765" cy="382" r="8" fill="#8fa49a"/>
    <circle class="mix" cx="735" cy="392" r="8" fill="#78928d"/>
    <circle class="mix" cx="704" cy="390" r="8" fill="#66837b"/>
    <circle class="mix" cx="677" cy="377" r="8" fill="#557366"/>
    <circle class="mix" cx="655" cy="353" r="8" fill="#416456"/>
    <circle class="mix" cx="686" cy="327" r="8" fill="#657b5b"/>
    <circle class="mix" cx="716" cy="315" r="8" fill="#7b8b65"/>
    <circle class="mix" cx="748" cy="322" r="8" fill="#8d9873"/>
    <circle class="mix" cx="766" cy="348" r="8" fill="#87988a"/>
    <circle class="mix" cx="738" cy="361" r="8" fill="#718983"/>
    <circle class="mix" cx="706" cy="358" r="8" fill="#5c786d"/>
    <circle class="mix" cx="720" cy="339" r="8" fill="#71806b"/>
    <circle class="mix" cx="606" cy="374" r="8" fill="#317553"/>
    <circle class="mix" cx="830" cy="290" r="8" fill="#becf00"/>
    <circle class="mix" cx="842" cy="390" r="8" fill="#657a89"/>
  </g>
</svg>
